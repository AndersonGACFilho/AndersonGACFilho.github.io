<script>
montarExercicios('aula-12', [
  {
    pergunta: '`UPDATE jogo SET preco_diaria = 9.00;` — sem WHERE. O que acontece?',
    alternativas: [
      'O banco pede confirmação',
      'Todas as linhas passam a custar 9,00, sem aviso nenhum',
      'Dá erro de sintaxe',
      'Só a primeira linha muda'
    ],
    certa: 1,
    porque: 'O comando é válido, e o banco faz exatamente o que foi mandado. Repare no detalhe cruel da demonstração: o Hollow Knight custava 6,00 e SUBIU para 9,00 — um UPDATE sem WHERE não "aumenta o preço", ele iguala tudo.'
  },
  {
    pergunta: 'Qual é o hábito que protege contra isso?',
    alternativas: [
      'Fazer backup antes de todo UPDATE',
      'Rodar um SELECT com o MESMO WHERE antes, e conferir quantas linhas vêm',
      'Usar sempre LIMIT 1',
      'Escrever o UPDATE em letra maiúscula'
    ],
    certa: 1,
    porque: 'Custa cinco segundos e responde a única pergunta que importa: o meu WHERE pega o que eu acho que pega? Se vierem cinco linhas quando você esperava uma, você descobriu o erro sem ter mudado nada.'
  },
  {
    pergunta: 'Você escreve `VALUES (Elden Ring, 13.00)`, sem aspas no título. Qual é o erro?',
    alternativas: [
      'ERROR: missing quotes',
      'ERROR: column "Elden" does not exist',
      'ERROR: invalid input syntax for type text',
      'Nenhum: o PostgreSQL aceita'
    ],
    certa: 1,
    porque: 'Sem aspas, o banco não lê aquilo como texto: lê como NOME DE COLUNA. Por isso a mensagem fala de coluna inexistente e não de aspas — é a mensagem que mais confunde no primeiro INSERT, porque ela aponta para o lugar certo com a palavra errada.'
  },
  {
    pergunta: 'E `VALUES (\'Elden Ring\', \'13.00\')`, com o preço entre aspas?',
    alternativas: [
      'Dá erro sempre',
      'Costuma funcionar — e é aí que mora a armadilha',
      'O preço vira zero',
      'O preço vira texto na tabela'
    ],
    certa: 1,
    porque: 'O PostgreSQL converte o texto para número quando ele cabe. Funciona, ninguém corrige, e um dia chega um valor que não converte — ou que converte errado, como "13,00" com vírgula. A regra segue o TIPO DA COLUNA, não o que funcionou ontem.'
  },
  {
    pergunta: 'Por que a ordem de inserção importa?',
    alternativas: [
      'Para a tabela ficar ordenada',
      'Porque a chave estrangeira exige que a linha referenciada já exista',
      'Porque o id é sequencial',
      'Não importa'
    ],
    certa: 1,
    porque: 'É a mesma ordem da criação das tabelas, pelo mesmo motivo. Inserir o empréstimo antes do cliente dá `Key (id_cliente)=(1) is not present in table "cliente"` — a FK da Aula 11 fazendo o trabalho dela.'
  },
  {
    pergunta: 'Dá para inserir várias linhas num comando só?',
    alternativas: [
      'Não, um INSERT por linha',
      'Dá: `VALUES (...), (...), (...)` — e ou entram todas ou não entra nenhuma',
      'Dá, mas cada uma entra separadamente',
      'Só com arquivo CSV'
    ],
    certa: 1,
    porque: 'E a segunda parte é a que importa: é um comando só, então é tudo ou nada. Se a terceira linha violar uma constraint, as duas primeiras também não entram. Isso é bom — evita ficar com metade da carga feita.'
  },
  {
    pergunta: '`DELETE FROM jogo;` — a tabela depois disso:',
    alternativas: [
      'Deixa de existir',
      'Continua existindo, vazia',
      'Vai para a lixeira',
      'Fica marcada como apagada'
    ],
    certa: 1,
    porque: 'DELETE apaga linhas; quem apaga a estrutura é o `DROP TABLE`. A tabela vazia continua com as colunas, os tipos e as constraints — e por isso dá para inserir de novo sem recriar nada. O que se perdeu foram os dados, e só o backup da Aula 17 traz de volta.'
  },
  {
    pergunta: 'Qual destes comandos é DDL, e não DML?',
    alternativas: [
      'INSERT',
      'ALTER TABLE',
      'UPDATE',
      'DELETE'
    ],
    certa: 1,
    porque: 'DDL mexe na ESTRUTURA — CREATE, ALTER, DROP. DML mexe nos DADOS — INSERT, UPDATE, DELETE. A distinção não é decoreba: na Aula 16 ela vira permissão, e dá para alguém ter direito de mudar dados sem ter direito de mudar tabelas.'
  }
]);
</script>
