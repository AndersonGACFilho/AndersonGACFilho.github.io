<script>
montarExercicios('aula-05', [
  {
    pergunta: 'Duas clientes se chamam Ana Silva. Você roda UPDATE ... WHERE nome = \'Ana Silva\'. O que acontece?',
    alternativas: [
      'O banco recusa, porque há duas',
      'Altera as duas, e nada acusa',
      'Altera a primeira que encontrar',
      'Pede confirmação'
    ],
    certa: 1,
    porque: 'Duas linhas alteradas, nenhum aviso. A segunda Ana perdeu o telefone dela e não sabe — é a Aula 01 de novo, por outro motivo.'
  },
  {
    pergunta: 'Por que nome não serve como chave primária?',
    alternativas: [
      'Porque é texto, e chave tem de ser número',
      'Porque homônimo existe, gente troca de nome, e ninguém digita igual duas vezes',
      'Porque ocupa muito espaço',
      'Porque o PostgreSQL não permite'
    ],
    certa: 1,
    porque: 'Nada impede tecnicamente. O que impede é que nome não identifica.'
  },
  {
    pergunta: 'Um cliente estrangeiro não tem CPF. Se o CPF for a chave primária:',
    alternativas: [
      'Entra com CPF nulo',
      'Não entra: chave primária não aceita nulo',
      'Entra com CPF zerado',
      'O banco gera um CPF'
    ],
    certa: 1,
    porque: 'Sem CPF não há linha, e o cliente fica de fora do sistema. Com id artificial, o CPF vira campo comum que pode faltar.'
  },
  {
    pergunta: 'Quando a chave natural é a escolha certa?',
    alternativas: [
      'Nunca: sempre use id serial',
      'Quando o valor não muda, não falta, não é sigiloso e já é curto',
      'Sempre que existir um documento oficial',
      'Quando a tabela tem poucas linhas'
    ],
    certa: 1,
    porque: 'A sigla do estado passa nos quatro testes — ali um id seria coluna a mais sem função.'
  },
  {
    pergunta: 'Uma plataforma tem muitos jogos; um jogo é de uma plataforma. Onde fica a chave estrangeira?',
    alternativas: ['Em plataforma', 'Em jogo', 'Nas duas', 'Numa terceira tabela'],
    certa: 1,
    porque: 'A chave estrangeira fica no lado do N. Do outro jeito, a plataforma teria de repetir a linha inteira uma vez por jogo.'
  },
  {
    pergunta: 'Um cliente aluga muitos jogos e um jogo é alugado por muitos clientes. Quantas tabelas?',
    alternativas: ['1', '2', '3', 'Depende do volume'],
    certa: 2,
    porque: 'N:N não cabe em nenhum dos dois lados: nasce uma terceira tabela — e é nela que a data do empréstimo vai morar.'
  },
  {
    pergunta: 'Numa relação 1:1, de que lado colocar a chave?',
    alternativas: [
      'Sempre na tabela criada primeiro',
      'No lado que pode faltar',
      'Nos dois, para garantir',
      'Numa tabela no meio'
    ],
    certa: 1,
    porque: 'Nem todo cliente tem cartão de sócio. A chave no lado opcional evita uma coluna nula na tabela principal.'
  },
  {
    pergunta: 'Por que evitar CPF como chave primária mesmo quando todo cliente tem um?',
    alternativas: [
      'Porque é lento para indexar',
      'Porque a chave vaza para URL, log e integração — e corrigir um CPF errado obriga a trocar a chave em toda tabela que aponta para ela',
      'Porque CPF pode repetir',
      'Porque não cabe em INTEGER'
    ],
    certa: 1,
    porque: 'Um id sequencial não diz nada sobre a pessoa; um CPF diz tudo. E id errado ninguém corrige, porque id não significa nada.'
  }
]);
</script>
