<script>
montarExercicios('aula-07', [
  {
    pergunta: 'O DER da locadora tem 5 entidades e 4 relacionamentos: dois N:N, um 1:N e um 1:1. Quantas tabelas saem daí?',
    alternativas: [
      '9 — uma por entidade e uma por relacionamento',
      '7 — uma por entidade, mais uma para cada N:N',
      '5 — uma por entidade, e todo relacionamento vira coluna',
      'Depende da quantidade de atributos'
    ],
    certa: 1,
    porque: 'Cinco entidades mais os dois N:N dão sete. O 1:N e o 1:1 não criam tabela: viram uma coluna de chave estrangeira — a do 1:1 com ÚNICO.'
  },
  {
    pergunta: 'Na notação emprestimo (id_emprestimo*, data_retirada, id_cliente CE/FK → cliente), para que serve a seta?',
    alternativas: [
      'Para indicar a ordem das colunas',
      'Para dizer para onde a chave estrangeira aponta — e na Aula 11 ela vira o REFERENCES',
      'Para marcar que a coluna é obrigatória',
      'É só enfeite da notação'
    ],
    certa: 1,
    porque: 'A seta é literalmente o REFERENCES do SQL. A regra prática: se você não consegue escrever o que vem depois da seta, a chave estrangeira está errada.'
  },
  {
    pergunta: 'Você escreve id_cliente REFERENCES cliente(id_cliente), mas a tabela cliente ainda não foi criada. O que o PostgreSQL responde?',
    alternativas: [
      'Cria assim mesmo e avisa depois',
      'ERROR: relation "cliente" does not exist',
      'Cria a tabela cliente vazia, automaticamente',
      'Aceita, porque a verificação só acontece no INSERT'
    ],
    certa: 1,
    porque: 'A tabela apontada precisa existir antes. Quase sempre é questão de ordem no script: emprestimo criado antes de cliente. É o erro que mais aparece na Aula 11.'
  },
  {
    pergunta: 'A tabela cliente existe e a coluna nome existe. Mesmo assim, REFERENCES cliente(nome) é recusado. Por quê?',
    alternativas: [
      'Porque nome é texto, e chave estrangeira só aceita número',
      'Porque nome não identifica uma linha só — pode haver duas Ana Souza',
      'Porque a coluna tem de ter o mesmo nome dos dois lados',
      'Porque falta criar um índice na coluna'
    ],
    certa: 1,
    porque: 'A mensagem é "there is no unique constraint matching given keys". Uma chave estrangeira precisa apontar para algo que identifique UMA linha — é a Aula 05 cobrando a conta.'
  },
  {
    pergunta: 'O cliente tem dois telefones. Como isso fica no modelo relacional?',
    alternativas: [
      'Duas colunas: telefone1 e telefone2',
      'Uma coluna telefone com os dois números separados por barra',
      'Uma tabela telefone_cliente, com uma linha por número',
      'Um campo de texto livre em observações'
    ],
    certa: 2,
    porque: 'Uma célula guarda um valor só: não existe coluna com lista dentro. Essa é, literalmente, a 1ª forma normal — e é a Aula 09.'
  },
  {
    pergunta: 'Seu grupo decide separar DADOS_BANCARIOS de CLIENTE num 1:1. O que a chave estrangeira precisa ter, além do REFERENCES?',
    alternativas: [
      'Precisa ser única',
      'Precisa ser chave primária composta',
      'Precisa aceitar nulo',
      'Nada além do REFERENCES'
    ],
    certa: 0,
    porque: 'Sem UNIQUE, dois registros de dados bancários poderiam apontar para o mesmo cliente — e aí o relacionamento já não seria 1:1. A constraint volta na Aula 11.'
  },
  {
    pergunta: 'Ao mapear, seu grupo acha útil acrescentar cliente.pontos_fidelidade, que não está no DER. O que fazer?',
    alternativas: [
      'Acrescentar só na lista de tabelas: o DER já cumpriu o papel dele',
      'Ou voltar e acrescentar no DER hoje, ou não criar a coluna',
      'Deixar para acertar o DER no fim do curso',
      'Criar uma tabela nova só para ela'
    ],
    certa: 1,
    porque: 'Mapear é traduzir, não criar. Os dois artefatos convivem até a Aula 18 — mexeu na lista, mexeu no .drawio no mesmo dia. Senão o DER vira ficção a partir da Aula 09.'
  },
  {
    pergunta: 'Por que a convenção é nome de tabela no singular — jogo, e não jogos?',
    alternativas: [
      'Porque o PostgreSQL recusa nomes no plural',
      'Porque a tabela guarda ocorrências de UM jogo, e porque jogo.titulo se lê melhor',
      'Porque nome no plural ocupa mais espaço em disco',
      'É indiferente: as duas formas são igualmente usadas'
    ],
    certa: 1,
    porque: 'Cada linha é uma ocorrência da entidade. E na Aula 14 você vai escrever jogo.titulo em toda junção — que se lê como português.'
  }
]);
</script>
