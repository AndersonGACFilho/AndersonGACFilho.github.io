  <text class="t eyebrow" x="560" y="26">O QUE ESTÁ DENTRO DELE AGORA</text>
  <path class="regua" d="M560 35 H1072"/>
  <path class="cartao" d="M29 52 H481 a9 9 0 0 1 9 9 V141 a9 9 0 0 1 -9 9 H29 Z"/>
  <path class="barra" d="M29 52 H24 a4 4 0 0 0 -4 4 V146 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(43 85) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="16" width="76" height="64" rx="8" stroke-dasharray="11 8"/>
    <rect x="26" y="32" width="44" height="14" rx="4" stroke="currentColor"/>
    <path d="M26 58h44M26 68h28"/>
    </g>
  </g>
  <text class="t nome" x="89" y="97">tabela jogo</text>
  <text class="t glosa" x="89" y="117">id_jogo · titulo · genero</text>
  <path class="cartao q" d="M569 52 H1063 a9 9 0 0 1 9 9 V141 a9 9 0 0 1 -9 9 H569 Z"/>
  <path class="barra q" d="M569 52 H564 a4 4 0 0 0 -4 4 V146 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(583 64) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="18" width="72" height="60" rx="7"/>
    <path d="M12 38h72" stroke="currentColor"/>
    <path d="M12 58h72M40 38v40M62 38v40"/>
    </g>
  </g>
  <text class="t nome" x="629" y="87">2 linhas hoje</text>
  <text class="t glosa" x="629" y="107">1 · God of War · Ação</text>
  <text class="t glosa" x="629" y="125">2 · Zelda · Aventura</text>
  <path class="seta" d="M498 101 H552" marker-end="url(#ponta)"/>
  <path class="cartao" d="M29 170 H481 a9 9 0 0 1 9 9 V259 a9 9 0 0 1 -9 9 H29 Z"/>
  <path class="barra" d="M29 170 H24 a4 4 0 0 0 -4 4 V264 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(43 203) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="16" width="76" height="64" rx="8" stroke-dasharray="11 8"/>
    <rect x="26" y="32" width="44" height="14" rx="4" stroke="currentColor"/>
    <path d="M26 58h44M26 68h28"/>
    </g>
  </g>
  <text class="t nome" x="89" y="215">tabela cliente</text>
  <text class="t glosa" x="89" y="235">id_cliente · nome · telefone</text>
  <path class="cartao" d="M569 170 H1063 a9 9 0 0 1 9 9 V259 a9 9 0 0 1 -9 9 H569 Z"/>
  <path class="barra" d="M569 170 H564 a4 4 0 0 0 -4 4 V264 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(583 182) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="18" width="72" height="60" rx="7"/>
    <path d="M12 38h72" stroke="currentColor"/>
