</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="1" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="5" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-ontem-voc%C3%AAs-escreveram-jogo-e-agora"><img src="../_comum/icones/mono/documento.svg" alt="icone" /> Ontem vocês escreveram <code>JOGO</code>. E agora?</h2>
<p>A entidade <code>JOGO</code> está no papel de vocês desde ontem. Só que uma caixa com o nome <code>JOGO</code> dentro não aluga nada.</p>
<p><strong>O que a locadora precisa saber sobre cada jogo</strong> para conseguir emprestá-lo?</p>
<ul>
<li data-marpit-fragment="1">título · gênero · ano de lançamento · classificação indicativa</li>
</ul>
<div class="atencao">
Cada um desses é um <strong>atributo</strong>: uma característica da entidade, um
dado guardado sobre <strong>cada ocorrência</strong> dela.
</div>
<div class="glossario">
<table>
<thead>
<tr>
<th>EN</th>
<th>PT</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>attribute</code></td>
<td>atributo — característica da entidade</td>
</tr>
<tr>
<td><code>field</code> / <code>column</code></td>
<td>campo / coluna — como o atributo aparece na tabela</td>
</tr>
<tr>
<td><code>value</code></td>
<td>valor — o conteúdo do atributo numa linha</td>
</tr>
</tbody>
</table>
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="6" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="legenda--o-atributo-no-desenho">Legenda — o atributo no desenho</h2>
<p>Ontem a caixa estava vazia. Hoje ela ganha <strong>linhas</strong> — cada uma é um atributo, com o <strong>tipo</strong> à esquerda e o <strong>nome</strong> à direita:</p>
<div class="cols">
<div>
<p><img class="center" src="img/legenda-caixa-vazia.svg" alt="A caixa da entidade JOGO, ainda sem nenhum atributo" style="width:216px;" /></p>
</div>
<div>
<p><img class="center" src="img/legenda-com-atributos.svg" alt="A mesma caixa JOGO, agora com os atributos e o tipo de cada um" style="width:262px;" /></p>
</div>
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="7" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-quantos-atributos-o-teste-da-necessidade"><img src="../_comum/icones/mono/filtro.svg" alt="icone" /> Quantos atributos? O teste da necessidade</h2>
<p>Para cada atributo candidato, pergunte:</p>
<ol class="passos">
<li>Alguém vai <strong>preencher</strong> isso, toda vez?</li>
<li>Alguém vai <strong>consultar</strong> ou <strong>decidir</strong> alguma coisa com isso?</li>
<li>Se ficar em branco, o sistema ainda funciona?</li>
</ol>
<div class="atencao">
Se a resposta for "não sei", o atributo provavelmente não entra ainda. É muito mais
barato <strong>acrescentar</strong> uma coluna depois do que limpar uma coluna cheia de lixo.
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="8" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-atributo-simples-%C3%97-composto"><img src="../_comum/icones/mono/recorte.svg" alt="icone" /> Atributo simples × composto</h2>
<div class="cols">
<div>
<p><strong>Composto (evite)</strong></p>
<p><code>endereco_completo</code> =<br />
&quot;Rua das Flores, 120, Porto Alegre&quot;</p>
<p>Filtrar por cidade exige &quot;cortar&quot; o texto.</p>
</div>
<div>
<p><strong>Simples (prefira)</strong></p>
<p><code>logradouro</code> · <code>numero</code> · <code>cidade</code> · <code>cep</code></p>
<p>Filtrar por cidade vira comparação direta.</p>
</div>
</div>
<p><img class="center" src="img/atributo-composto.svg" alt="CLIENTE_RUIM guarda o endereco inteiro numa coluna so; CLIENTE_BOM separa em logradouro, numero e cidade" style="width:757px;" /></p>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="9" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-atributo-multivalorado--o-que-fazer-com-v%C3%A1rios"><img src="../_comum/icones/mono/duplicado.svg" alt="icone" /> Atributo multivalorado — o que fazer com &quot;vários&quot;</h2>
<p>O cliente tem <strong>dois telefones</strong>. Onde guardar?</p>
<table>
<thead>
<tr>
<th>Tentativa</th>
<th>Problema</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>telefones</code> = &quot;99999-1111 / 98888-2222&quot;</td>
<td>Como buscar por um número? Como saber qual é o celular?</td>
</tr>
<tr>
<td><code>telefone1</code>, <code>telefone2</code>, <code>telefone3</code></td>
<td>E quem tem quatro? E quem tem um só, sobra coluna vazia?</td>
</tr>
<tr>
<td>Uma <strong>entidade</strong> <code>TELEFONE</code> ligada a <code>CLIENTE</code></td>
<td>Funciona para qualquer quantidade</td>
</tr>
</tbody>
</table>
<div class="atencao">
Atributo que aceita <strong>vários valores</strong> quase sempre é uma
<strong>entidade nova</strong> esperando para nascer. Guarde esta frase — ela volta
inteira na Aula 09 (1ª forma normal).
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="3" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="10" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-atributo-derivado--o-que-n%C3%A3o-se-guarda"><img src="../_comum/icones/mono/grafico.svg" alt="icone" /> Atributo derivado — o que não se guarda</h2>
<p><code>idade</code> do cliente <strong>não</strong> é atributo. <code>data_nascimento</code> é.</p>
<ul>
<li data-marpit-fragment="1">A idade muda sozinha todo ano; a data de nascimento, nunca</li>
<li data-marpit-fragment="2">Guardar idade significa ter que atualizar todo mundo, todo dia</li>
<li data-marpit-fragment="3">A idade se <strong>calcula</strong> a partir da data, na hora da consulta</li>
</ul>
<div class="atencao">
Mesma lógica do erro "modelar o relatório" da Aula 03: guarde o
<strong>fato</strong>, calcule o <strong>resultado</strong>.
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-fragments="5" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="11" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="checagem-do-bloco-1">Checagem do Bloco 1</h2>
<div class="com-qr">
<div>
<p>Classifique: <strong>simples</strong>, <strong>composto</strong>, <strong>multivalorado</strong> ou <strong>derivado</strong>?</p>
<ul>
<li data-marpit-fragment="1"><code>nome_completo</code> do cliente</li>
<li data-marpit-fragment="2"><code>email</code> do cliente, que pode ter mais de um</li>
<li data-marpit-fragment="3"><code>tempo_de_cadastro</code> em anos</li>
<li data-marpit-fragment="4"><code>titulo</code> do jogo</li>
<li data-marpit-fragment="5"><code>nome_e_telefone</code> num campo só</li>
</ul>
</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-class="divisor" data-theme="senac" lang="pt-BR" class="divisor" data-marpit-pagination="12" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--class:divisor;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-class="divisor" data-theme="senac" lang="pt-BR" class="divisor" data-marpit-pagination="13" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--class:divisor;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>

<h1 id="bloco-2">Bloco 2</h1>
<h2 id="tipos-de-dado--dizendo-ao-banco-o-que-esperar">Tipos de dado — dizendo ao banco o que esperar</h2>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-fragments="3" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="14" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-por-que-o-tipo-importa"><img src="../_comum/icones/mono/molde.svg" alt="icone" /> Por que o tipo importa</h2>
<p>Todo atributo tem um <strong>tipo de dado</strong>: o banco precisa saber o que pode entrar ali.</p>
<ul>
<li data-marpit-fragment="1">O tipo <strong>impede lixo</strong>: <code>data_retirada</code> não aceita &quot;amanhã de tarde&quot;</li>
<li data-marpit-fragment="2">O tipo <strong>habilita operação</strong>: só dá para somar o que é número, só dá para calcular intervalo entre datas</li>
<li data-marpit-fragment="3">O tipo <strong>ordena certo</strong>: como texto, <code>10</code> vem antes de <code>9</code></li>
</ul>
<div class="atencao">
Esta é a <strong>integridade</strong> da Aula 01 na prática: a primeira regra que o banco
faz valer por você é o tipo de cada coluna.
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="15" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-os-tipos-que-vamos-usar"><img src="../_comum/icones/mono/tabela.svg" alt="icone" /> Os tipos que vamos usar</h2>
<div class="glossario">
<table>
<thead>
<tr>
<th>Tipo (PostgreSQL)</th>
<th>EN → PT</th>
<th>Use para</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>VARCHAR(n)</code></td>
<td>variable character — texto de até n caracteres</td>
<td>nome, título, gênero</td>
</tr>
<tr>
<td><code>TEXT</code></td>
<td>text — texto sem limite</td>
<td>descrição, observação</td>
</tr>
<tr>
<td><code>INTEGER</code></td>
<td>integer — número inteiro</td>
<td>ano, quantidade</td>
</tr>
<tr>
<td><code>NUMERIC(p,s)</code></td>
<td>numeric — número com casas decimais</td>
<td>preço, valor</td>
</tr>
<tr>
<td><code>DATE</code></td>
<td>date — data</td>
<td>data de retirada</td>
</tr>
<tr>
<td><code>BOOLEAN</code></td>
<td>boolean — verdadeiro/falso</td>
<td>ativo, devolvido</td>
</tr>
</tbody>
</table>
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="16" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="icone-erro-comum--n%C3%BAmero-que-n%C3%A3o-%C3%A9-n%C3%BAmero"><img src="../_comum/icones/mono/aviso.svg" alt="icone" /> Erro comum — número que não é número</h2>
<table>
<thead>
<tr>
<th>Campo</th>
<th>Parece</th>
<th>É</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>telefone</code></td>
<td>número</td>
<td><strong>texto</strong> — tem traço, parêntese e zero à esquerda</td>
</tr>
<tr>
<td><code>cep</code></td>
<td>número</td>
<td><strong>texto</strong> — <code>01000-000</code> perderia o zero</td>
</tr>
<tr>
<td><code>cpf</code></td>
<td>número</td>
<td><strong>texto</strong> — mesma coisa</td>
</tr>
<tr>
<td><code>numero_da_casa</code></td>
<td>número</td>
<td><strong>texto</strong> — existe &quot;120-A&quot; e &quot;s/n&quot;</td>
</tr>
</tbody>
</table>
<div class="atencao">
Regra prática: se você <strong>não vai somar nem calcular média</strong>, provavelmente
é texto — mesmo que só tenha dígitos.
</div>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-fragments="3" data-paginate="true" data-header="UC2 · Implementar Banco de Dados" data-footer="Aula 04 · 09/10/2026 · Indicadores 2, 4" data-theme="senac" lang="pt-BR" data-marpit-pagination="17" style="--paginate:true;--header:UC2 · Implementar Banco de Dados;--footer:Aula 04 · 09/10/2026 · Indicadores 2, 4;--theme:senac;" data-marpit-pagination-total="33" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;200ms&quot;,&quot;builtinFallback&quot;:true}">
<header>UC2 · Implementar Banco de Dados</header>
<h2 id="escolhendo-o-tamanho">Escolhendo o tamanho</h2>
<p><code>VARCHAR(n)</code> — quanto vale o <code>n</code>?</p>
<ul>
<li data-marpit-fragment="1"><strong>Apertado demais</strong> quebra: <code>VARCHAR(20)</code> para título de jogo corta &quot;The Legend of Zelda: Tears of the Kingdom&quot;</li>
<li data-marpit-fragment="2"><strong>Largo demais</strong> não custa espaço no PostgreSQL, mas esconde erro: <code>VARCHAR(500)</code> para um nome aceita um parágrafo inteiro colado sem querer</li>
<li data-marpit-fragment="3">Comece por um valor honesto: nome <code>100</code>, título <code>150</code>, gênero <code>40</code>, e-mail <code>120</code></li>
</ul>
<footer>Aula 04 · 09/10/2026 · Indicadores 2, 4</footer>
