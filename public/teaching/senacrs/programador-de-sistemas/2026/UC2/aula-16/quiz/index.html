<script>
montarExercicios('aula-16', [
  {
    pergunta: 'Você acabou de rodar `CREATE ROLE estagiario LOGIN PASSWORD \'...\'`. O que ele já consegue fazer?',
    alternativas: [
      'Ler todas as tabelas',
      'Nada: no PostgreSQL uma role nasce sem acesso a nada',
      'Tudo no banco que ele criar',
      'Depende da versão'
    ],
    certa: 1,
    porque: 'O padrão é negar, e isso é uma boa notícia: não é preciso revogar nada antes de começar. O privilégio mínimo é o ponto de partida da ferramenta — quem sai dele é quem digita `ALL PRIVILEGES`.'
  },
  {
    pergunta: 'O atendente tenta `DELETE FROM cliente` e leva `permission denied`. Isso é desconfiança dele?',
    alternativas: [
      'Sim, é controle sobre o funcionário',
      'Não: apagar cliente nunca foi tarefa do balcão — a permissão só reflete o trabalho real',
      'Sim, e por isso é melhor dar acesso total',
      'Não, é limitação técnica do PostgreSQL'
    ],
    certa: 1,
    porque: 'Privilégio mínimo não é sobre confiar menos nas pessoas: é sobre reduzir o estrago de um engano. O atendente mais competente da locadora também digita errado às vezes, e a permissão é o que impede que o erro vire perda.'
  },
  {
    pergunta: 'O que `GRANT SELECT ON jogo TO estagiario` concede, exatamente?',
    alternativas: [
      'Leitura em todas as tabelas',
      'Leitura numa tabela só, e só leitura',
      'Leitura e escrita em jogo',
      'Acesso ao banco inteiro'
    ],
    certa: 1,
    porque: 'Cada GRANT vale para UMA tabela e UM verbo. É essa granularidade que torna o privilégio mínimo possível de escrever: dá para conceder exatamente o recorte que o trabalho exige, sem sobra.'
  },
  {
    pergunta: 'Qual é o problema de `GRANT ALL PRIVILEGES`?',
    alternativas: [
      'Nenhum, é mais prático',
      'Inclui DELETE, TRUNCATE e mais — e você passa a autorizar coisas que nem pensou em autorizar',
      'É mais lento',
      'Não funciona em views'
    ],
    certa: 1,
    porque: 'É o que a demonstração 2 mostra: concedido só para o estagiário consultar, e ele passa a poder apagar o catálogo. O argumento "depois a gente ajusta" é a parte que nunca acontece — ninguém volta para apertar uma permissão que está funcionando.'
  },
  {
    pergunta: 'Por que `role` é uma palavra só para usuário e grupo?',
    alternativas: [
      'Foi um erro de tradução',
      'Porque são a mesma coisa no PostgreSQL: uma role com LOGIN é usuário, e uma role pode conter outras',
      'Porque grupo foi descontinuado',
      'Para simplificar a documentação'
    ],
    certa: 1,
    porque: 'A consequência prática é boa: cria-se uma role `balcao` com os privilégios do balcão e concedem-se eles uma vez; depois cada atendente novo só precisa de `GRANT balcao TO fulano`. Mudou a regra do balcão, muda num lugar só.'
  },
  {
    pergunta: 'O estagiário tem `SELECT` na view `catalogo_publico` e nada na tabela `jogo`. Ele vê o preço de custo?',
    alternativas: [
      'Vê, porque a view lê a tabela',
      'Não: a coluna não existe na view, e ele não tem acesso à tabela',
      'Vê, se usar SELECT *',
      'Depende do dono da view'
    ],
    certa: 1,
    porque: 'São duas proteções empilhadas, e isso é de propósito. A view recorta as colunas (Aula 15); a permissão impede o desvio pela tabela original. Qualquer uma sozinha deixaria uma porta — a view sem a permissão deixaria ele consultar `jogo` direto.'
  },
  {
    pergunta: 'O que a LGPD tem a ver com `GRANT`?',
    alternativas: [
      'Nada, são assuntos separados',
      'A lei exige acesso limitado ao necessário — e o GRANT é como isso se escreve num banco',
      'A LGPD proíbe guardar telefone',
      'Só se aplica a empresas grandes'
    ],
    certa: 1,
    porque: 'Nome, telefone e CPF de cliente são dados pessoais. "Acesso limitado ao necessário" é a mesma frase do privilégio mínimo, escrita por um legislador — e quem trabalha com banco de dados responde por ela.'
  },
  {
    pergunta: 'Por que não trabalhar o dia inteiro com o usuário `postgres`?',
    alternativas: [
      'Porque é mais lento',
      'Porque ele pode tudo em todos os bancos — qualquer engano de digitação vira estrago grande',
      'Porque a senha expira',
      'Porque o pgAdmin não permite'
    ],
    certa: 1,
    porque: 'É o mesmo motivo de não navegar na internet como administrador do Windows. E é o que vocês vinham fazendo até esta aula — de propósito, para aprender sem obstáculo. A partir daqui, cada papel com a sua conta.'
  }
]);
</script>
