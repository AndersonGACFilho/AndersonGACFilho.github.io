  <text class="t nome" x="941" y="116">Banco de volta</text>
  <text class="t glosa" x="941" y="136">pg_restore</text>
  <path class="seta traco t1" d="M263 120 H297" marker-end="url(#ponta)"/>
  <path class="seta traco t2" d="M547 120 H581" marker-end="url(#ponta)"/>
