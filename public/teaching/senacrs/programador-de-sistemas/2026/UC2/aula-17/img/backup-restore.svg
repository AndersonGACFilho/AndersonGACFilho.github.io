<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 216" width="1092" height="216"
     role="img" aria-label="O banco em producao vira um arquivo pelo pg_dump, o arquivo e guardado em outro lugar, e o pg_restore devolve o banco a partir dele.">
  <style>
    /* @estilo-padrao */
    /* diagrama.css — o estilo de TODO diagrama de aula, numa fonte só.
     *
     * POR QUE existe: SVG externo carregado por `img` não importa folha de estilo —
     * nem `xml-stylesheet`, nem `@import`, nem `link`. Cada arquivo precisa carregar
     * o próprio bloco. Copiar isto em 28 arquivos faria qualquer ajuste de paleta
     * virar 28 edições, e uma ficaria para trás.
     *
     * Fonte única aqui; `scripts/estilo-diagrama.mjs` injeta entre os marcadores.
     * Edite AQUI e rode `npm run diagramas:estilo`.
     *
     * ---------------------------------------------------------------------------
     * A IDENTIDADE: a barra esquerda.
     *
     * O deck marca o que importa com uma régua laranja à esquerda e o canto direito
     * arredondado — está no `.atencao` e no título de "mão na massa" do senac.css.
     * O diagrama usa o mesmo gesto: toda caixa é um cartão com régua à esquerda,
     * azul quando é conteúdo e laranja quando é o ponto do slide.
     *
     * O que veio antes era retângulo azul chapado com texto branco centrado: lia
     * como fluxograma de ferramenta, não como material desta UC.
     * ---------------------------------------------------------------------------
     *
     * As razões de contraste estão medidas em PADRAO-DIAGRAMA.md.
     */

    .lig { stroke-width: 1.6; fill: none; }
    .lig-o { stroke-width: 1.6; }
    .seta { stroke-width: 1.8; fill: none; }
    .ent-borda { fill: none; stroke-width: 1.5; }
    .caixa { stroke-width: 1.5; }

    .t    { font-family: 'Raleway', 'Segoe UI', 'Noto Sans', system-ui, sans-serif; fill: #12243a; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }

    /* ---------- tipografia ----------
       Hierarquia dentro do cartão: a primeira linha nomeia, as de baixo explicam.
       Antes era tudo do mesmo tamanho e da mesma cor, e nada se destacava. */
    /* A escala saiu de uma medicao, nao do olho. O deck tem corpo de 28px e rodape
       de 13,4px num slide de 1280x720. Com as fontes antigas o rotulo principal do
       diagrama chegava a tela com 14,8px -- do tamanho do numero da pagina -- e a
       glosa com 12,5px, MENOR que o rodape. Agora o nome chega a ~21px e a glosa a
       ~16px, que e legivel de longe sem competir com o titulo do slide. */
    .nome   { font-size: 23px; font-weight: 650; }
    .glosa  { font-size: 18px; font-weight: 400; }
    .nome-c { font-size: 23px; font-weight: 650; fill: #12243a; text-anchor: middle; }
    .glosa-c{ font-size: 18px; font-weight: 400; fill: #4a5f75; text-anchor: middle; }
    .rot    { font-size: 19px; fill: #ffffff; text-anchor: middle; }
    .rot-min{ font-size: 15px; fill: #ffffff; text-anchor: middle; }
    .nota   { font-size: 18px; }
    .dica   { font-size: 19px; }
    .seta-rot { font-size: 16px; text-anchor: middle; }

    /* O rótulo de grupo imita a sobrancelha do deck: pequena, espaçada, laranja,
       sobre uma régua fina. Sem caixa cinza em volta — a caixa empilhava moldura
       dentro de moldura e sujava o desenho. */
    .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 0.14em; }
    .regua   { stroke-width: 1; fill: none; }

    /* ---------- cartões ----------
       Largura igual entre irmãos é a razão de desenhar à mão: quem escreve a
       geometria escreve o mesmo `width`, e não há motor de layout para discordar. */
    /* O simbolo segue a cor do cartao: azul no comum, laranja no que carrega o
       ponto do slide. Os icones da pasta `_comum/icones/mono` desenham com
       `stroke: #FFFFFF`, e o embutidor troca por `currentColor` — dai o `color`
       aqui mandar em todos eles. */

    /* Caixa cheia: para dado, não para conceito. A tabelinha de células usa isto. */

    /* ---------- notacao de DER ----------
       A faixa do atributo e um retangulo de largura INTEIRA. O Mermaid pintava so
       sob as colunas de tipo e nome e deixava a coluna das chaves branca: a
       coluninha nao acompanhava a faixa da linha dela. */

    .ent-nome  { font-size: 19px; font-weight: 700; fill: #ffffff; text-anchor: middle; letter-spacing: 0.04em; }
    .ent-tipo  { font-size: 16px; fill: #7d8b99; }
    .ent-campo { font-size: 18px; fill: #12243a; }
    .ent-chave { font-size: 15px; font-weight: 800; fill: #b34700; text-anchor: end; letter-spacing: 0.03em; }

    .verbo     { font-size: 17px; fill: #12243a; text-anchor: middle; }

    /* ---------- selo numerado ---------- */

    .numero { font-size: 16px; font-weight: 800; fill: #ffffff; text-anchor: middle; }

    /*
     * ---------- o relógio ----------
     *
     *    0s - 2s   repouso no estado final   -- e o quadro que o PDF pega
     *    2s        RESET
     *    2s -10s   ate quatro turnos de 2s
     *   10s -12s   repouso no estado final
     *
     * Estado se marca por PORCENTAGEM nos keyframes de cada diagrama; atraso
     * deslocaria o relogio inteiro e cada painel reiniciaria num instante
     * diferente. O realce abaixo pode usar atraso porque nao guarda estado.
     *
     * Nenhuma animacao usa `animation-fill-mode`: durante o atraso o navegador
     * mostra o estilo normal, que e o estado final. E por isso que o quadro zero
     * -- o do PDF -- sai completo.
     */
    @keyframes acende-barra  { 0%, 16.6% { fill: #e85d00; } 16.7%, 100% { fill: #01337e; } }
    @keyframes acende-cartao { 0%, 16.6% { fill: #fff1e6; } 16.7%, 100% { fill: #f2f6fa; } }
    @keyframes acende-selo   { 0%, 16.6% { fill: #ff7809; } 16.7%, 100% { fill: #4a5f75; } }
    @keyframes acende-numero { 0%, 16.6% { fill: #10161c; } 16.7%, 100% { fill: #ffffff; } }
    @keyframes acende-tinta  { 0%, 16.6% { fill: #b34700; font-weight: 700; } 16.7%, 100% { fill: #12243a; font-weight: 400; } }
    @keyframes acende-traco  { 0%, 16.6% { stroke: #e85d00; stroke-width: 3; } 16.7%, 100% { stroke: #7d8b99; stroke-width: 1.8; } }

    .realce .barra  { animation: acende-barra 12s linear infinite; }
    .realce .cartao { animation: acende-cartao 12s linear infinite; }
    .realce .selo   { animation: acende-selo 12s linear infinite; }
    .realce .numero { animation: acende-numero 12s linear infinite; }
    .tinta          { animation: acende-tinta 12s linear infinite; }
    .traco          { animation: acende-traco 12s linear infinite; }

    /* O atraso precisa VENCER o atalho `animation` em especificidade: o atalho
       reescreve `animation-delay` para zero. `.realce .barra` vale 0-2-0, entao um
       seletor 0-1-0 e ignorado e todos os turnos acendem juntos. Foi o primeiro
       defeito do primeiro diagrama animado. */
    .realce.v1 .barra, .realce.v1 .cartao, .realce.v1 .selo, .realce.v1 .numero, .t1.tinta, .t1.traco { animation-delay: 2s; }
    .realce.v2 .barra, .realce.v2 .cartao, .realce.v2 .selo, .realce.v2 .numero, .t2.tinta, .t2.traco { animation-delay: 4s; }
    .realce.v3 .barra, .realce.v3 .cartao, .realce.v3 .selo, .realce.v3 .numero, .t3.tinta, .t3.traco { animation-delay: 6s; }
    .realce.v4 .barra, .realce.v4 .cartao, .realce.v4 .selo, .realce.v4 .numero, .t4.tinta, .t4.traco { animation-delay: 8s; }

    @media (prefers-reduced-motion: reduce) {
      .realce .barra, .realce .cartao, .realce .selo, .realce .numero,
      .tinta, .traco, .anima { animation: none; }
    }
    /* ===========================================================================
       VARIANTE SOLTA: o diagrama direto sobre o slide, sem o cartao branco.
       Vale so para o SVG cuja raiz tem class="solto".

       POR QUE o painel e ESCURO. A primeira tentativa foi painel de branco a 10%:
       integrava, mas media 1,24:1 contra o slide -- invisivel -- e ainda BAIXAVA o
       contraste do texto, porque branco sobre aquele painel dava 6,03 enquanto
       branco direto no azul dava 7,46.

       Projetor emite luz: ele nao projeta escuro, o preto e a luz da sala. Modelando
       a luz ambiente como um piso de luminancia (0 sala escura, 0,10 com luz, 0,25
       sala clara ou projetor fraco), o painel claro reprovava em AA com a luz acesa:

         painel claro, nome branco      6,03   4,01   2,67
         painel escuro, nome branco    18,94   6,78   3,45
         cartao branco (para comparar) 14,44   5,90   3,16

       O painel escuro passa ate o cartao branco nas tres condicoes, e fica visivel
       (2,54:1 contra o slide). Por isso ele, e nao o claro.
       =========================================================================== */
    .cartao   { fill: #01102a; }
    .cartao.q { fill: #2b1708; }
    .barra    { fill: #9cc9ff; }
    .barra.q  { fill: #ffb065; }
    .nome     { fill: #ffffff; }
    .glosa,
    .nota,
    .dica,
    .seta-rot { fill: #cfe0f5; }
    .eyebrow  { fill: #ffc287; }
    .regua    { stroke: rgba(255, 255, 255, 0.28); }
    .seta     { stroke: #cfe0f5; }
    .ico      { color: #9cc9ff; }
    .q + .ico, .ico.q { color: #ffb065; }
    .selo     { fill: rgba(255, 255, 255, 0.24); }
    .numero   { fill: #ffffff; }
    .caixa    { fill: #9cc9ff; stroke: #9cc9ff; }
    .morta    { fill: rgba(255, 255, 255, 0.12); }
    .rot,
    .rot-min  { fill: #01102a; }

    /* DER na variante solta */
    .ent       { fill: #01102a; }
    .ent-borda { stroke: rgba(255, 255, 255, 0.34); }
    .faixa     { fill: rgba(255, 255, 255, 0.06); }
    .cab       { fill: #9cc9ff; }
    .cab-q     { fill: #ffb065; }
    .ent-nome  { fill: #01102a; }
    .ent-tipo  { fill: #8fb3d9; }
    .ent-campo { fill: #ffffff; }
    .ent-chave { fill: #ffc287; }
    .lig       { stroke: #cfe0f5; }
    .lig-o     { fill: none; stroke: #cfe0f5; }
    .verbo     { fill: #cfe0f5; }
    .verbo-bg  { fill: none; }
    /* Entidade sem atributo: caixa inteira, nao cabecalho solto. */
    .ent-so      { fill: #01102a; stroke: rgba(255, 255, 255, 0.34); stroke-width: 1.5; }
    .ent-nome-so { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; letter-spacing: 0.04em; }

    @keyframes acende-barra-solta  { 0%, 16.6% { fill: #ffb065; } 16.7%, 100% { fill: #9cc9ff; } }
    @keyframes acende-cartao-solto { 0%, 16.6% { fill: #2b1708; } 16.7%, 100% { fill: #01102a; } }
    .realce .barra  { animation: acende-barra-solta 12s linear infinite; }
    .realce .cartao { animation: acende-cartao-solto 12s linear infinite; }
    /* @fim */
  </style>

  <defs>
    <marker id="ponta" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#cfe0f5"/>
    </marker>
  </defs>
  <text class="t eyebrow" x="20" y="28">O CAMINHO DE IDA E DE VOLTA</text>
  <path class="regua" d="M20 39 H1072"/>
  <path class="cartao" d="M29 78 H251 a9 9 0 0 1 9 9 V181 a9 9 0 0 1 -9 9 H29 Z"/>
  <path class="barra" d="M29 78 H24 a4 4 0 0 0 -4 4 V186 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(45 114) scale(0.4167)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="48" cy="24" rx="30" ry="11"/>
    <path d="M18 24v48c0 6.1 13.4 11 30 11s30-4.9 30-11V24"/>
    <path d="M18 48c0 6.1 13.4 11 30 11s30-4.9 30-11" stroke="currentColor"/>
    </g>
  </g>
  <text class="t nome" x="103" y="129">Banco locadora</text>
  <text class="t glosa" x="103" y="155">em produção</text>
  <path class="cartao" d="M317 78 H539 a9 9 0 0 1 9 9 V181 a9 9 0 0 1 -9 9 H317 Z"/>
  <path class="barra" d="M317 78 H312 a4 4 0 0 0 -4 4 V186 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(333 114) scale(0.4167)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 8h32l18 18v62a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6Z"/>
    <path d="M54 8v20h20"/>
    <path d="M30 50h36M30 62h36M30 74h22" stroke="currentColor" stroke-width="4.5"/>
    </g>
  </g>
  <text class="t nome" x="391" y="129">Arquivo .backup</text>
  <text class="t glosa" x="391" y="155">pg_dump</text>
  <path class="cartao" d="M605 78 H827 a9 9 0 0 1 9 9 V181 a9 9 0 0 1 -9 9 H605 Z"/>
  <path class="barra" d="M605 78 H600 a4 4 0 0 0 -4 4 V186 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(621 86) scale(0.4167)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="26" width="80" height="44" rx="8"/>
    <circle cx="34" cy="48" r="14"/>
    <circle cx="34" cy="48" r="4" fill="currentColor" stroke="none"/>
    <path d="M60 40h18M60 56h18" stroke="currentColor"/>
    </g>
  </g>
  <text class="t nome" x="679" y="116">Guardado fora</text>
  <text class="t glosa" x="679" y="142">pen drive, nuvem,</text>
  <text class="t glosa" x="679" y="166">outro servidor</text>
  <path class="cartao q" d="M893 78 H1063 a9 9 0 0 1 9 9 V181 a9 9 0 0 1 -9 9 H893 Z"/>
  <path class="barra q" d="M893 78 H888 a4 4 0 0 0 -4 4 V186 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(909 114) scale(0.4167)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="48" cy="16" rx="26" ry="9"/>
    <path d="M22 16v22c0 5 11.6 9 26 9s26-4 26-9V16"/>
    <path d="M48 76V52" stroke="currentColor"/>
    <path d="M36 64l12-12 12 12" stroke="currentColor"/>
    <path d="M14 88h68"/>
    </g>
  </g>
  <text class="t nome" x="967" y="129">De volta</text>
  <text class="t glosa" x="967" y="155">pg_restore</text>
  <path class="seta traco t1" d="M268 134 H300" marker-end="url(#ponta)"/>
  <path class="seta traco t2" d="M556 134 H588" marker-end="url(#ponta)"/>
  <path class="seta traco t3" d="M844 134 H876" marker-end="url(#ponta)"/>
  <text class="t seta-rot" x="284" y="118">backup</text>
  <text class="t seta-rot" x="572" y="118">copia</text>
  <text class="t seta-rot" x="860" y="118">restore</text>
</svg>
