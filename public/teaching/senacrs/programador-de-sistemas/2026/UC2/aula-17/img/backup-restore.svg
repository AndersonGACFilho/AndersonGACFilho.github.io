    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="48" cy="24" rx="30" ry="11"/>
    <path d="M18 24v48c0 6.1 13.4 11 30 11s30-4.9 30-11V24"/>
    <path d="M18 48c0 6.1 13.4 11 30 11s30-4.9 30-11" stroke="currentColor"/>
    </g>
  </g>
  <text class="t nome" x="89" y="116">Banco locadora</text>
  <text class="t glosa" x="89" y="136">em produção</text>
  <path class="cartao" d="M313 75 H531 a9 9 0 0 1 9 9 V156 a9 9 0 0 1 -9 9 H313 Z"/>
  <path class="barra" d="M313 75 H308 a4 4 0 0 0 -4 4 V161 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(327 104) scale(0.333333)">
