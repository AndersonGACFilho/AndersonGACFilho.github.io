    </g>
  </g>
  <text class="t nome" x="657" y="106">Guardado fora</text>
  <text class="t glosa" x="657" y="126">pen drive, nuvem,</text>
  <text class="t glosa" x="657" y="144">outro servidor</text>
  <path class="cartao q" d="M881 75 H1063 a9 9 0 0 1 9 9 V156 a9 9 0 0 1 -9 9 H881 Z"/>
  <path class="barra q" d="M881 75 H876 a4 4 0 0 0 -4 4 V161 a4 4 0 0 0 4 4 Z"/>
