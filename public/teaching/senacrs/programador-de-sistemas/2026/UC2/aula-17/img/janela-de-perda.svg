    <path d="M14 88h68"/>
    </g>
  </g>
  <text class="t nome" x="89" y="104">Backup</text>
  <text class="t glosa" x="89" y="124">segunda, 23h</text>
  <path class="seta" d="M223 108 H233" marker-end="url(#ponta)"/>
  <path class="cartao" d="M249 50 H427 a9 9 0 0 1 9 9 V157 a9 9 0 0 1 -9 9 H249 Z"/>
  <path class="barra" d="M249 50 H244 a4 4 0 0 0 -4 4 V162 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(263 71) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="20" width="76" height="66" rx="8"/>
    <path d="M10 40h76M30 10v18M66 10v18"/>
    <rect x="26" y="52" width="14" height="12" rx="3" fill="currentColor" stroke="none"/>
    </g>
  </g>
  <text class="t nome" x="309" y="94">Terça</text>
  <text class="t glosa" x="309" y="114">o dia inteiro</text>
  <text class="t glosa" x="309" y="132">de trabalho</text>
  <path class="seta" d="M443 108 H453" marker-end="url(#ponta)"/>
  <path class="cartao" d="M469 50 H647 a9 9 0 0 1 9 9 V157 a9 9 0 0 1 -9 9 H469 Z"/>
  <path class="barra" d="M469 50 H464 a4 4 0 0 0 -4 4 V162 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(483 92) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="20" width="34" height="46" rx="6"/>
    <path d="M14 34h18M14 46h12"/>
    <rect x="56" y="30" width="34" height="46" rx="6"/>
    <path d="M64 44h18M64 56h12"/>
    <path d="m40 40 16 16M56 40 40 56" stroke="currentColor" stroke-width="7"/>
    <path d="M48 24v-8M48 80v-8" stroke="currentColor"/>
    </g>
  </g>
  <text class="t nome" x="529" y="104">Falha</text>
  <text class="t glosa" x="529" y="124">terça, 18h</text>
  <path class="seta" d="M663 108 H673" marker-end="url(#ponta)"/>
  <path class="cartao" d="M689 50 H867 a9 9 0 0 1 9 9 V157 a9 9 0 0 1 -9 9 H689 Z"/>
  <path class="barra" d="M689 50 H684 a4 4 0 0 0 -4 4 V162 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(703 71) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="48" cy="16" rx="26" ry="9"/>
    <path d="M22 16v22c0 5 11.6 9 26 9s26-4 26-9V16"/>
    <path d="M48 76V52" stroke="currentColor"/>
    <path d="M36 64l12-12 12 12" stroke="currentColor"/>
    <path d="M14 88h68"/>
