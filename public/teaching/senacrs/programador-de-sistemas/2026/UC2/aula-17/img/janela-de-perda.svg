  </g>
  <text class="t nome" x="749" y="94">Restore</text>
  <text class="t glosa" x="749" y="114">volta para</text>
  <text class="t glosa" x="749" y="132">segunda, 23h</text>
  <path class="seta" d="M883 108 H893" marker-end="url(#ponta)"/>
