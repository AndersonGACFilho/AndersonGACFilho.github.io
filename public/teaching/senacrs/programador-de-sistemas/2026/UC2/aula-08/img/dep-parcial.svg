  <text class="t nome" x="539" y="96">data_retirada</text>
  <text class="t glosa" x="539" y="116">só da 1ª parte</text>
  <path class="cartao q" d="M479 154 H761 a9 9 0 0 1 9 9 V221 a9 9 0 0 1 -9 9 H479 Z"/>
  <path class="barra q" d="M479 154 H474 a4 4 0 0 0 -4 4 V226 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(493 176) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 8 86 28v40L48 88 10 68V28L48 8Z"/>
