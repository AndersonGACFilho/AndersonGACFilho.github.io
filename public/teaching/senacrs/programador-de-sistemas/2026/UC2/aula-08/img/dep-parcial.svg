  <path class="cartao" d="M829 108 H1063 a9 9 0 0 1 9 9 V175 a9 9 0 0 1 -9 9 H829 Z"/>
  <path class="barra" d="M829 108 H824 a4 4 0 0 0 -4 4 V180 a4 4 0 0 0 4 4 Z"/>
