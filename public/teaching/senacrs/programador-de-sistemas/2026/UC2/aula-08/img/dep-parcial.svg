  <path class="barra q" d="M479 62 H474 a4 4 0 0 0 -4 4 V134 a4 4 0 0 0 4 4 Z"/>
  <g class="ico" transform="translate(493 84) scale(0.333333)">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
