<script>
montarExercicios('aula-03', [
  {
    pergunta: 'O dono diz: "a locadora abre às 9h e fecha às 19h". Isso entra no banco?',
    alternativas: [
      'Sim, é informação da locadora',
      'Não: não tem várias, não muda, não vira linha',
      'Só se houver mais de uma filial',
      'Sim, como uma tabela de horários'
    ],
    certa: 1,
    porque: 'É verdade e não é dado que se guarda. Cada frase verdadeira que entra sem precisar é uma tabela a manter.'
  },
  {
    pergunta: '"Quero saber quantas vezes cada jogo foi alugado no mês." O que isso vira?',
    alternativas: [
      'Uma tabela de relatório mensal',
      'Um campo contador em JOGO',
      'Nada novo: sai de EMPRESTIMO com uma contagem',
      'Uma entidade RELATORIO'
    ],
    certa: 2,
    porque: 'É pergunta, não dado. Modelar o relatório em vez do dado é o erro comum da aula — e um contador desatualiza na primeira devolução.'
  },
  {
    pergunta: 'Por que "catálogo" não é entidade?',
    alternativas: [
      'Porque não tem atributos suficientes',
      'Porque é o nome coletivo do conjunto de jogos — a tabela jogo já é o catálogo',
      'Porque catálogo é um relatório',
      'Porque só viraria entidade com mais de mil jogos'
    ],
    certa: 1,
    porque: 'Acervo, estoque, cardápio e elenco caem na mesma armadilha: parecem entidade e são só o nome do conjunto.'
  },
  {
    pergunta: 'Qual é o primeiro teste que "locadora" não passa?',
    alternativas: ['Existe mais de um?', 'Tem mais de um dado dentro?', 'Precisa ser guardado separado?', 'Passa nos três'],
    certa: 0,
    porque: 'Existe uma só. Guardar uma linha numa tabela para sempre ter uma linha não resolve nada — e os outros dois testes nem chegam a rodar.'
  },
  {
    pergunta: '"gênero" tem vários, mas cada um é só um nome. O veredito é:',
    alternativas: [
      'entidade, sempre',
      'campo de JOGO, por enquanto',
      'nunca entra no modelo',
      'relacionamento'
    ],
    certa: 1,
    porque: 'Vira campo até o dia em que o gênero precisar de descrição ou faixa etária. Aí promove — e o "por enquanto" é a parte importante da resposta.'
  },
  {
    pergunta: 'Você modelou gênero como campo. O dono diz que um jogo pode ter mais de um. O que isso custa?',
    alternativas: [
      'Nada: é só separar por vírgula',
      'Um ALTER TABLE e reescrever toda consulta que filtra por gênero',
      'Uma linha nova',
      'Recriar o banco do zero'
    ],
    certa: 1,
    porque: 'Se fosse entidade, seria uma linha nova em jogo_genero e nenhuma consulta mudaria. Nenhuma das duas estava errada ontem; uma envelheceu melhor.'
  },
  {
    pergunta: 'No desenho, o que é o losango?',
    alternativas: ['Uma entidade', 'Um atributo', 'O relacionamento', 'Uma chave primária'],
    certa: 2,
    porque: 'Retângulo é entidade, losango é relacionamento. O nome dele sai do verbo da frase: o cliente ALUGA o jogo.'
  },
  {
    pergunta: 'De onde vem o minimundo?',
    alternativas: [
      'Do manual do PostgreSQL',
      'De perguntar ao cliente qual tabela ele quer',
      'Do levantamento de requisitos — perguntando o problema, não a solução',
      'Da lista de telas do sistema'
    ],
    certa: 2,
    porque: 'Perguntar "que tabela você quer?" devolve a opinião do cliente sobre banco de dados. Perguntar o problema devolve o problema.'
  }
]);
</script>
